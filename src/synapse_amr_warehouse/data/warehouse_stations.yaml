# Warehouse Waypoint Stations and Zone Map
# Coordinates are in meters relative to world frame (0, 0 at warehouse center)

stations:
  charging_dock:
    name: "Autonomous Charging Station 1"
    zone: "CHARGING_ZONE"
    x: 8.0
    y: -6.5
    yaw: 3.14159
    type: "DOCK"
    tolerance: 0.05
    description: "AMR fast charging dock with visual align target"

  inbound_dock:
    name: "Inbound Receiving Bay 1"
    zone: "INBOUND"
    x: -8.0
    y: -6.5
    yaw: 1.5708
    type: "PICKUP"
    tolerance: 0.15
    description: "Raw goods inbound unloading dock"

